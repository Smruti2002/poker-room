name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Generated TypeScript protocol is up to date
        run: |
          go run github.com/gzuidhof/tygo@v0.2.21 generate
          git diff --exit-code ../web/src/protocol/types.ts || { echo "Run make protocol and commit the result"; exit 1; }
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/server ./cmd/server

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build image
        run: docker build --build-arg VERSION=ci -t poker-room .
      - name: Run it and smoke-test it
        run: |
          docker run -d --name app -p 8080:8080 -e SNAPSHOT_PATH=/tmp/rooms.json poker-room
          (cd server && go run ./cmd/smoke -url http://localhost:8080 -version ci -wait 30s)
      - name: Rooms are saved on stop
        run: |
          docker stop app
          docker logs app 2>&1 | tail -5
          docker logs app 2>&1 | grep -q '"rooms saved"'

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run Playwright
        run: npm run e2e
        working-directory: web
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
