name: Deploy

# Deploys main to Fly.io once CI has passed on it, then smoke-tests the live
# site. Also runnable by hand from the Actions tab. Does nothing until the
# FLY_API_TOKEN repository secret exists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_URL: https://poker-room-smruti.fly.dev

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Check for the Fly token
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Version
        if: steps.token.outputs.ready == 'true'
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ready == 'true'
      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: exactly one machine, never a second one.
        run: flyctl deploy --remote-only --ha=false --build-arg VERSION=${{ steps.version.outputs.sha }}
      - uses: actions/setup-go@v6
        if: steps.token.outputs.ready == 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Smoke-test the live site
        if: steps.token.outputs.ready == 'true'
        working-directory: server
        run: go run ./cmd/smoke -url "$APP_URL" -version ${{ steps.version.outputs.sha }}
