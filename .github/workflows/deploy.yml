name: Deploy

# Deploys to Fly.io only when you ask: Actions → Deploy → Run workflow.
# Merges to main never deploy on their own, because each deploy restarts
# the server and briefly disconnects anyone playing. It deploys the latest
# main, but only if CI passed on that exact commit, then smoke-tests the
# live site.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to check CI's result for the commit

env:
  APP_URL: https://poker-room-smruti.fly.dev

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
            --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          echo "CI for ${GITHUB_SHA::7}: ${result:-no run}"
          if [ "$result" != "completed success" ]; then
            echo "::error::CI hasn't passed on ${GITHUB_SHA::7} yet. Wait for it (or fix it), then run Deploy again."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: exactly one machine, never a second one.
        run: flyctl deploy --remote-only --ha=false --build-arg VERSION=${{ steps.version.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Smoke-test the live site
        working-directory: server
        run: go run ./cmd/smoke -url "$APP_URL" -version ${{ steps.version.outputs.sha }}
